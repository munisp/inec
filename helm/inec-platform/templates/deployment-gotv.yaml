{{- if .Values.gotv.enabled }}
# GOTV/campaign API service (R5-089): the web app calls /gotv/* same-origin;
# without this workload the production topology had no /gotv backend and
# every campaign page returned index.html/404.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gotv
  labels:
    app.kubernetes.io/name: inec-gotv
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gotv
spec:
  replicas: {{ .Values.gotv.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: inec-gotv
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inec-gotv
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8103"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: gotv
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.gotv.image.repository }}:{{ .Values.gotv.image.tag | default .Values.global.tag }}"
          imagePullPolicy: {{ .Values.gotv.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 8103
              name: http
              protocol: TCP
          env:
            - name: APP_ENV
              value: {{ .Values.global.environment | quote }}
            - name: INEC_ENV
              value: {{ .Values.global.environment | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-credentials
                  key: url
            - name: REDIS_URL
              value: "redis://{{ .Release.Name }}-redis-master:6379/2"
            - name: KAFKA_BROKERS
              value: "{{ .Release.Name }}-kafka:9092"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: inec-jwt-secret
                  key: secret
            # gotv-svc fail-fast requirements (cmd/gotv-svc/main.go)
            - name: INTERNAL_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: inec-internal-secrets
                  key: internal-service-secret
            - name: GOTV_MOBILE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: inec-internal-secrets
                  key: gotv-mobile-jwt-secret
            - name: GOTV_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: inec-internal-secrets
                  key: gotv-encryption-key
          # Probe paths match gotv-svc's registered routes (/health, /ready).
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            failureThreshold: 2
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            {{- toYaml .Values.gotv.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gotv
  labels:
    app.kubernetes.io/name: inec-gotv
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - port: 8103
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: inec-gotv
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
