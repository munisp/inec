# INEC backend PrometheusRule.
#
# R5-088 (2026 audit): the previous revision queried http_requests_total,
# http_request_duration_seconds_bucket, waf_blocked_requests_total,
# auth_failed_attempts_total, rate_limited_requests_total,
# inec_middleware_connected, inec_database_healthy and
# inec_collation_discrepancy_count — series the app NEVER emitted, so only
# the `up{}` alert could ever fire. Every expression below is written
# against series the monolith actually registers/emits
# (inec-go-backend/metrics.go, inec-go-backend/mw_openappsec.go):
#   inec_http_requests_total{method,path,status}          (emitted per request)
#   inec_http_request_duration_seconds_bucket{method,path}(emitted per request)
#   inec_results_submitted_total{state_code,status}       (emitted per submit)
#   inec_handler_panics_total{path}                       (emitted per panic)
#   inec_middleware_healthy{component}                    (15s exporter, metrics.go)
#   inec_database_healthy                                 (15s exporter, metrics.go)
#   inec_db_connections_active                            (15s exporter, metrics.go)
#   inec_db_query_duration_seconds_bucket{query_type}     (emitted per query)
#   inec_waf_inactive_requests_total                      (emitted when WAF detached)
# Remaining metric-emission gaps (geofence violations, collation
# discrepancy, per-handler resultsSubmitted increments) are tracked in
# ops/HANDOFF-W6.md — no alert below references a non-existent series.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: inec-backend-alerts
  namespace: inec
  labels:
    app: inec-backend
    prometheus: kube-prometheus
spec:
  groups:
    - name: inec-backend.availability
      rules:
        - alert: INECBackendDown
          expr: up{job="inec-backend"} == 0
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "INEC Backend is DOWN"
            description: "No healthy backend pods responding for > 2 minutes"
            runbook_url: "https://runbooks.inec.ng/backend-down"

        - alert: INECBackendHighErrorRate
          expr: |
            sum(rate(inec_http_requests_total{job="inec-backend", status=~"5.."}[5m]))
            / sum(rate(inec_http_requests_total{job="inec-backend"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "High error rate on INEC Backend (> 5%)"
            description: "{{ $value | humanizePercentage }} of requests returning 5xx"

        - alert: INECBackendHighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(inec_http_request_duration_seconds_bucket{job="inec-backend"}[5m])) by (le)
            ) > 2.0
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "P95 latency > 2s on INEC Backend"
            description: "95th percentile response time is {{ $value }}s"

        - alert: INECBackendHandlerPanics
          expr: |
            sum(rate(inec_handler_panics_total{job="inec-backend"}[5m])) > 0
          for: 1m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "HTTP handlers are panicking"
            description: "{{ $value }} panics/sec recovered on {{ $labels.path }}"

    - name: inec-backend.security
      rules:
        # WAF block-rate alert replaced: the app emits no waf_blocked_requests_total.
        # inec_waf_inactive_requests_total > 0 means traffic reached the backend
        # WITHOUT WAF inspection (OpenAppSec detached) — the alertable condition.
        - alert: INECWAFInactive
          expr: |
            sum(rate(inec_waf_inactive_requests_total{job="inec-backend"}[5m])) > 0
          for: 5m
          labels:
            severity: warning
            team: security
          annotations:
            summary: "Traffic bypassing WAF (OpenAppSec inactive)"
            description: "{{ $value }} req/s reached the backend without WAF inspection"

        # Proxy for a dedicated auth_failed_attempts_total (see ops/HANDOFF-W6.md):
        # failed logins surface as 401/403 on /auth/*.
        - alert: INECAuthBruteForce
          expr: |
            sum(rate(inec_http_requests_total{job="inec-backend", path=~"/auth/login", status=~"401|403"}[5m])) > 5
          for: 2m
          labels:
            severity: critical
            team: security
          annotations:
            summary: "Possible brute force attack on auth endpoint"
            description: "{{ $value }} failed auth attempts per second"

        - alert: INECRateLimitExceeded
          expr: |
            sum(rate(inec_http_requests_total{job="inec-backend", status="429"}[5m])) > 20
          for: 5m
          labels:
            severity: info
            team: platform
          annotations:
            summary: "Rate limiting triggered frequently"
            description: "{{ $value }} requests/sec rejected with 429"

    - name: inec-backend.middleware
      rules:
        - alert: INECMiddlewareDisconnected
          expr: |
            inec_middleware_healthy{job="inec-backend"} == 0
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Middleware {{ $labels.component }} disconnected"
            description: "{{ $labels.component }} has been disconnected for > 5 minutes"

        - alert: INECDatabaseUnhealthy
          expr: |
            inec_database_healthy{job="inec-backend"} == 0
          for: 1m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Database health check failing"
            description: "Database has been unhealthy for > 1 minute"

        - alert: INECDatabasePoolExhaustion
          expr: |
            inec_db_connections_active{job="inec-backend"} > 45
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "DB connection pool near exhaustion"
            description: "{{ $value }} open connections (pool limit ~50)"

        - alert: INECDatabaseSlowQueries
          expr: |
            histogram_quantile(0.95,
              sum(rate(inec_db_query_duration_seconds_bucket{job="inec-backend"}[5m])) by (le)
            ) > 1
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "DB query p95 > 1s"
            description: "Database queries are slow — check indexes/lock contention"

    - name: inec-backend.election
      rules:
        # NOTE: inec_results_submitted_total is registered but per-handler
        # increments are pending (ops/HANDOFF-W6.md). Until that lands this
        # alert will report "stalled" — treat as a known limitation, not a
        # pipeline outage.
        - alert: INECResultSubmissionStalled
          expr: |
            rate(inec_results_submitted_total[15m]) == 0
            and on() (hour() >= 8 and hour() <= 18)
          for: 30m
          labels:
            severity: warning
            team: elections
          annotations:
            summary: "No results submitted in 30 minutes during election hours"
            description: "Result submission pipeline may be stalled"
