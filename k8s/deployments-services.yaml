# 2026-08-12 hardening: image registry and tag are placeholders — replace
# ghcr.io/REPLACE_WITH_YOUR_ORG and REPLACE_WITH_RELEASE_TAG with your
# registry and a pinned, immutable release tag before applying. Prefer the
# helm/inec-platform chart (global.imageRegistry / global.tag) for the
# backend/frontend/inference workloads.
# Service-level K8s deployments for GOTV platform microservices.
# Each has: startup/liveness/readiness probes, preStop hooks,
# terminationGracePeriodSeconds, resource limits, and KEDA-compatible labels.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotv-svc
  namespace: inec
  labels:
    app: gotv-svc
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gotv-svc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: gotv-svc
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8100"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: gotv-svc
      terminationGracePeriodSeconds: 30
      containers:
        - name: gotv-svc
          image: ghcr.io/munisp/inec-services-gotv-svc:latest
          # R5-093: image runs as non-root uid 10001/app (see services Dockerfile)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8100
              name: http
            - containerPort: 8101
              name: grpc
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: inec-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis://redis-master.inec.svc.cluster.local:6379/2"
            - name: KAFKA_BROKERS
              value: "kafka-0.kafka-headless.inec.svc.cluster.local:9092"
            - name: KEYCLOAK_ISSUER_URL
              value: "http://keycloak.inec.svc.cluster.local:8080/realms/inec"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            failureThreshold: 2
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotv-engine
  namespace: inec
  labels:
    app: gotv-engine
    tier: engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gotv-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: gotv-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8095"
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: gotv-engine
          image: ghcr.io/munisp/inec-services-gotv-engine:latest
          # R5-093: image runs as non-root uid 10001/app (see services Dockerfile)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8095
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: inec-secrets
                  key: database-url
            - name: PORT
              value: "8095"
            # API key enforced by gotv-engine on inbound requests.
            # Expected secret: Secret/inec-secrets, key "gotv-engine-api-key".
            - name: GOTV_ENGINE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: inec-secrets
                  key: gotv-engine-api-key
            # Tenancy is fail-closed: production pods refuse to boot without
            # either GOTV_ENGINE_PARTY_KEYS (multi-tenant) or this explicit
            # single-tenant opt-in. This deployment is single-tenant: party_id
            # is trusted from request bodies. Switch to GOTV_ENGINE_PARTY_KEYS
            # before serving multiple parties from one deployment.
            - name: GOTV_SINGLE_TENANT_MODE
              value: "true"
            - name: ENVIRONMENT
              value: "production"
            - name: RUST_LOG
              value: "info"
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 2
            timeoutSeconds: 2
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 3"]
---
apiVersion: apps/v1
