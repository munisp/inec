  name: inference-engine
  namespace: inec
  labels:
    app: inference-engine
    tier: engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: inference-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8091"
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: inference-engine
          image: ghcr.io/munisp/inec-services-inference-engine:latest
          # R5-093: image runs as non-root uid 10001/app (see services Dockerfile)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8091
              name: http
          env:
            - name: PORT
              value: "8091"
            - name: MODELS_DIR
              value: "/app/models"
            - name: RUST_LOG
              value: "info"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 2
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 3"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluvio-stream
  namespace: inec
  labels:
    app: fluvio-stream
    tier: streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fluvio-stream
  template:
    metadata:
      labels:
        app: fluvio-stream
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: fluvio-stream
          image: ghcr.io/munisp/inec-services-fluvio-stream:latest
          # R5-093: image runs as non-root uid 10001/app (see services Dockerfile)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 9003
              name: http
          env:
            - name: PORT
              value: "9003"
            - name: FLUVIO_ENDPOINT
              value: "fluvio.inec.svc.cluster.local:9003"
            - name: RUST_LOG
              value: "info"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 3"]
          volumeMounts:
            - name: checkpoint-data
              mountPath: /data
      volumes:
        - name: checkpoint-data
          persistentVolumeClaim:
            claimName: fluvio-checkpoints
---
