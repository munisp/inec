# PostgreSQL WAL archiving / PITR configuration snippet (R5-084).
#
# STATUS: NOT ACTIVE. Nothing in the committed manifests applies these
# settings — today the only backup is the 6-hourly pg_dump CronJob, so the
# achievable RPO is up to 6 hours (NOT the "RPO 0" the DR document claims;
# see docs/DISASTER_RECOVERY.md §1 reality note).
#
# To enable PITR, provision object storage (EXTERNAL dependency: S3-compatible
# bucket, IAM, retention/lifecycle policy) and apply the settings below to
# the primary, then schedule periodic base backups (e.g. daily
# `wal-g backup-push`) and rehearse restore per
# deploy/backup/RESTORE_RUNBOOK.md section 3.

# ---- postgresql.conf (primary) ----
wal_level = replica               # minimum for WAL archiving; 'logical' also valid
archive_mode = on
# wal-g pushes each WAL segment to object storage. Replace the bucket/prefix;
# credentials come from the environment (AWS_* / WALG_*), never inline.
archive_command = 'wal-g wal-push %p'
archive_timeout = 60s             # cap WAL-switch latency -> bounds archive gap
# Keep enough WAL locally to re-seed the streaming replica after short outages:
wal_keep_size = 4GB

# ---- wal-g environment (set via Secret, never committed) ----
# WALG_S3_PREFIX=s3://inec-pg-wal-<env>/<cluster-id>
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (or IRSA workload identity)
# WALG_COMPRESSION_METHOD=zstd

# ---- recovery (on the PITR target instance) ----
# restore_command = 'wal-g wal-fetch %f %p'
# recovery_target_time = '2026-08-12 17:59:00+01'   # just before the incident
# recovery_target_action = promote
# signal file: touch $PGDATA/recovery.signal
