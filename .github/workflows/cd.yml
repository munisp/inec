name: INEC Platform CD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, branch, or tag to deploy on the protected Kasicloud runner"
        required: true
        default: "main"
        type: string
      environment:
        description: "Protected deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - staging
          - production

concurrency:
  group: inec-kasicloud-deployment-${{ github.event.inputs.environment || 'build' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/inec

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-backend
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./inec-go-backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-frontend
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./inec-frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-kasicloud:
    name: Deploy to Kasicloud
    if: github.event_name == 'workflow_dispatch'
    needs: [build-backend, build-frontend]
    runs-on: [self-hosted, linux, x64, kasicloud]
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    steps:
      - name: Check out the approved deployment reference
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Verify protected production configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f /etc/inec/production.env
          test -d /srv/inec/models
          test -f /srv/inec/models/anomaly_xgboost.onnx
          test -f /srv/inec/models/anomaly_xgboost.manifest.json
          docker compose --env-file /etc/inec/production.env -f docker-compose.yml config --quiet

      - name: Build and apply the Compose release
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file /etc/inec/production.env -f docker-compose.yml up -d --build --remove-orphans

      - name: Require healthy core services
        shell: bash
        run: |
          set -euo pipefail
          services=(
            frontend
            go-backend
            inference-engine
            ai-anomaly-detection
            document-ai
            satellite-change-detection
            campaign-planning
          )
          deadline=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            unhealthy=0
            for service in "${services[@]}"; do
              container_id="$(docker compose --env-file /etc/inec/production.env -f docker-compose.yml ps -q "$service")"
              if [ -z "$container_id" ]; then
                echo "${service}: container is absent"
                unhealthy=1
                continue
              fi
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")"
              echo "${service}: ${health}"
              if [ "$health" != healthy ]; then
                unhealthy=1
              fi
            done
            if [ "$unhealthy" -eq 0 ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for healthy core services" >&2
          docker compose --env-file /etc/inec/production.env -f docker-compose.yml ps
          docker compose --env-file /etc/inec/production.env -f docker-compose.yml logs --tail=200 \
            go-backend inference-engine ai-anomaly-detection document-ai satellite-change-detection
          exit 1

      - name: Run local deployment smoke checks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error http://127.0.0.1:8088/healthz
          curl --fail --show-error http://127.0.0.1:3000/health

      - name: Record deployed source revision
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${GITHUB_SHA}" | sudo tee /srv/inec/DEPLOYED_GIT_SHA >/dev/null
