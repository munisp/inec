# Builds and pushes an updated image for whichever of the 13 app services
# changed on this push - nothing more. It never touches the cluster: the
# cluster's control plane is Tailscale-only and unreachable from
# GitHub-hosted runners. Flux's image-reflector-controller (ImageRepository/
# ImagePolicy per service, see newwave_platform_terraform's
# apps/fluxcd-newwave-dev/image-automation/image-policies-inec.yaml)
# notices the new tag, commits the bump into k8s-flux/, and Flux's own
# Kustomization deploys it from there. Pure pull-based deploy.
#
# Tag format YYYYMMDD-HHMM (one per run, shared across every service built
# in that run) - matches the filterTags pattern on every ImagePolicy. This
# intentionally does NOT match the repos' pre-existing "archive-*" tags, so
# ImagePolicy only ever considers images built through this pipeline.
name: build-and-push

on:
  push:
    branches: [development]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: tag
        run: echo "tag=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      # Every service builds from its own self-contained directory - no
      # shared-lib root-context complication like whatsapp-commerce had.
      - id: detect
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD || echo "")
          echo "Changed files:"
          echo "$CHANGED"

          declare -A DIR=(
            [ai-anomaly-detection]="services/ai-anomaly-detection"
            [biometric-go]="services/biometric-go"
            [biometric-python]="services/biometric-python"
            [campaign-planning]="services/campaign-planning"
            [digital-twin-simulation]="services/digital-twin-simulation"
            [document-ai]="services/document-ai"
            [federated-fraud-detection]="services/federated-fraud-detection"
            [homomorphic-tally]="services/homomorphic-tally"
            [inec-backend]="inec-go-backend"
            [inec-frontend]="inec-frontend"
            [inference-engine]="services/inference-engine"
            [predictive-resource-allocation]="services/predictive-resource-allocation"
            [satellite-change-detection]="services/satellite-change-detection"
          )

          RESULT="[]"
          for svc in "${!DIR[@]}"; do
            dir="${DIR[$svc]}"
            if echo "$CHANGED" | grep -q "^${dir}/"; then
              RESULT=$(echo "$RESULT" | jq -c --arg name "$svc" --arg dir "$dir" \
                '. + [{"name":$name,"dir":$dir}]')
            fi
          done
          echo "Services to build: $RESULT"
          echo "services=$RESULT" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: docker
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.dir }}
          file: ${{ matrix.service.dir }}/Dockerfile
          push: true
          tags: registry.digitalocean.com/talentgraph-auth/${{ matrix.service.name }}:${{ needs.changes.outputs.tag }}
