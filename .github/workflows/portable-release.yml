name: Build Portable Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, branch, or tag to build as an immutable portable release
        required: true
        default: main
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build immutable portable images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Check out requested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Record checked-out revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish portable Caddy image
        uses: docker/build-push-action@v7
        with:
          context: ./caddy
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/inec-caddy:sha-${{ steps.revision.outputs.short_sha }}
          cache-from: type=gha,scope=portable-caddy
          cache-to: type=gha,mode=max,scope=portable-caddy

      - name: Build and publish INEC frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./inec-frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/inec-frontend:sha-${{ steps.revision.outputs.short_sha }}
          cache-from: type=gha,scope=portable-frontend
          cache-to: type=gha,mode=max,scope=portable-frontend

      - name: Build and publish INEC backend image
        uses: docker/build-push-action@v7
        with:
          context: ./inec-go-backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/inec-backend:sha-${{ steps.revision.outputs.short_sha }}
          cache-from: type=gha,scope=portable-backend
          cache-to: type=gha,mode=max,scope=portable-backend

      - name: Build and publish campaign dashboard image
        uses: docker/build-push-action@v7
        with:
          context: ./campaign-platform
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/inec-campaign-dashboard:sha-${{ steps.revision.outputs.short_sha }}
          cache-from: type=gha,scope=portable-campaign-dashboard
          cache-to: type=gha,mode=max,scope=portable-campaign-dashboard

      - name: Create portable release manifest
        shell: bash
        run: |
          set -euo pipefail
          cat > PORTABLE_RELEASE_MANIFEST.md <<EOF
          # Portable INEC Release

          Revision: \`${{ steps.revision.outputs.sha }}\`

          | Service | Immutable image |
          |---|---|
          | Caddy edge | \`ghcr.io/${{ github.repository_owner }}/inec-caddy:sha-${{ steps.revision.outputs.short_sha }}\` |
          | INEC frontend | \`ghcr.io/${{ github.repository_owner }}/inec-frontend:sha-${{ steps.revision.outputs.short_sha }}\` |
          | INEC backend | \`ghcr.io/${{ github.repository_owner }}/inec-backend:sha-${{ steps.revision.outputs.short_sha }}\` |
          | Campaign dashboard | \`ghcr.io/${{ github.repository_owner }}/inec-campaign-dashboard:sha-${{ steps.revision.outputs.short_sha }}\` |

          Apply these exact values to the protected portable environment file, then run the portable deployment workflow or the guarded host script.
          EOF

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: portable-release-manifest-${{ steps.revision.outputs.short_sha }}
          path: PORTABLE_RELEASE_MANIFEST.md
          if-no-files-found: error
