apiVersion: apps/v1
kind: Deployment
metadata:
  name: biometric-go
  namespace: inec
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: biometric-go
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: biometric-go
    spec:
      automountServiceAccountToken: true
      containers:
      - env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: database-url
              name: inec-postgres-secrets
              optional: false
        image: registry.digitalocean.com/talentgraph-auth/biometric-go:archive-20260722-011124 # {"$imagepolicy": "flux-system:inec-biometric-go"}
        imagePullPolicy: IfNotPresent
        name: biometric-go
        ports:
        - containerPort: 8092
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      imagePullSecrets:
      - name: talentgraph-auth-pull
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30