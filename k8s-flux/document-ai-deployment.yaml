apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-ai
  namespace: inec
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: document-ai
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: document-ai
    spec:
      automountServiceAccountToken: true
      containers:
      - image: registry.digitalocean.com/talentgraph-auth/document-ai:archive-20260722-024227 # {"$imagepolicy": "flux-system:inec-document-ai"}
        imagePullPolicy: IfNotPresent
        name: document-ai
        ports:
        - containerPort: 8089
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 512Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      imagePullSecrets:
      - name: talentgraph-auth-pull
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30