apiVersion: apps/v1
kind: Deployment
metadata:
  name: biometric-python
  namespace: inec
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: biometric-python
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: biometric-python
    spec:
      automountServiceAccountToken: true
      containers:
      - env:
        - name: INFERENCE_ENGINE_URL
          value: http://inference-engine:8091
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: database-url
              name: inec-postgres-secrets
              optional: false
        image: registry.digitalocean.com/talentgraph-auth/biometric-python:archive-20260722-023305 # {"$imagepolicy": "flux-system:inec-biometric-python"}
        imagePullPolicy: IfNotPresent
        name: biometric-python
        ports:
        - containerPort: 8090
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 512Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      imagePullSecrets:
      - name: talentgraph-auth-pull
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30