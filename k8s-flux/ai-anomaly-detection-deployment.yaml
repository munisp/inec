apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-anomaly-detection
  namespace: inec
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-anomaly-detection
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-anomaly-detection
    spec:
      automountServiceAccountToken: true
      containers:
      - env:
        - name: INFERENCE_ENGINE_URL
          value: http://inference-engine:8091
        image: registry.digitalocean.com/talentgraph-auth/ai-anomaly-detection:archive-20260722-012330 # {"$imagepolicy": "flux-system:inec-ai-anomaly-detection"}
        imagePullPolicy: IfNotPresent
        name: ai-anomaly-detection
        ports:
        - containerPort: 8200
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      imagePullSecrets:
      - name: talentgraph-auth-pull
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30