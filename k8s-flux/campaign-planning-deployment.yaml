apiVersion: apps/v1
kind: Deployment
metadata:
  name: campaign-planning
  namespace: inec
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: campaign-planning
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: campaign-planning
    spec:
      automountServiceAccountToken: true
      containers:
      - env:
        - name: PORT
          value: "8206"
        - name: NODE_ENV
          value: production
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: database-url
              name: inec-postgres-secrets
              optional: false
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: jwt-secret
              name: inec-secrets
              optional: false
        image: registry.digitalocean.com/talentgraph-auth/campaign-planning:archive-20260723-095605 # {"$imagepolicy": "flux-system:inec-campaign-planning"}
        imagePullPolicy: IfNotPresent
        name: campaign-planning
        ports:
        - containerPort: 8206
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      imagePullSecrets:
      - name: talentgraph-auth-pull
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30