apiVersion: apps/v1
kind: Deployment
metadata:
  name: satellite-change-detection
  namespace: inec
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: satellite-change-detection
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: satellite-change-detection
    spec:
      automountServiceAccountToken: true
      containers:
      - image: registry.digitalocean.com/talentgraph-auth/satellite-change-detection:archive-20260722-013956 # {"$imagepolicy": "flux-system:inec-satellite-change-detection"}
        imagePullPolicy: IfNotPresent
        name: satellite-change-detection
        ports:
        - containerPort: 8204
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      imagePullSecrets:
      - name: talentgraph-auth-pull
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30