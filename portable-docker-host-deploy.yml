name: Portable Docker Host Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, branch, or tag to deploy on the portable Docker host
        required: true
        default: main
        type: string
      environment:
        description: Protected GitHub environment containing portable-host connection settings
        required: true
        default: production
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: inec-portable-docker-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to portable Docker host
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    env:
      PORTABLE_DEPLOY_HOST: ${{ secrets.PORTABLE_DEPLOY_HOST }}
      PORTABLE_DEPLOY_USER: ${{ secrets.PORTABLE_DEPLOY_USER }}
      PORTABLE_DEPLOY_SSH_KEY: ${{ secrets.PORTABLE_DEPLOY_SSH_KEY }}
      PORTABLE_DEPLOY_KNOWN_HOSTS: ${{ secrets.PORTABLE_DEPLOY_KNOWN_HOSTS }}
      PORTABLE_DEPLOY_PATH: ${{ secrets.PORTABLE_DEPLOY_PATH }}
      PORTABLE_DEPLOY_ENV_FILE: ${{ secrets.PORTABLE_DEPLOY_ENV_FILE }}
    steps:
      - name: Validate protected deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for value in PORTABLE_DEPLOY_HOST PORTABLE_DEPLOY_USER PORTABLE_DEPLOY_SSH_KEY PORTABLE_DEPLOY_KNOWN_HOSTS PORTABLE_DEPLOY_PATH PORTABLE_DEPLOY_ENV_FILE; do
            if [ -z "${!value}" ]; then
              echo "Required protected deployment secret is missing: ${value}" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PORTABLE_DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PORTABLE_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy immutable release and run smoke checks
        shell: bash
        env:
          DEPLOY_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          deploy_ref_b64="$(printf %s "$DEPLOY_REF" | base64 -w0)"
          deploy_path_b64="$(printf %s "$PORTABLE_DEPLOY_PATH" | base64 -w0)"
          deploy_env_file_b64="$(printf %s "$PORTABLE_DEPLOY_ENV_FILE" | base64 -w0)"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "${PORTABLE_DEPLOY_USER}@${PORTABLE_DEPLOY_HOST}" \
            "DEPLOY_REF_B64=${deploy_ref_b64} DEPLOY_PATH_B64=${deploy_path_b64} DEPLOY_ENV_FILE_B64=${deploy_env_file_b64} bash -s" <<'REMOTE'
          set -euo pipefail
          DEPLOY_REF="$(printf %s "$DEPLOY_REF_B64" | base64 -d)"
          DEPLOY_PATH="$(printf %s "$DEPLOY_PATH_B64" | base64 -d)"
          DEPLOY_ENV_FILE="$(printf %s "$DEPLOY_ENV_FILE_B64" | base64 -d)"
          test -d "$DEPLOY_PATH/.git"
          test -f "$DEPLOY_ENV_FILE"
          cd "$DEPLOY_PATH"
          git fetch --tags origin
          git checkout --detach "$DEPLOY_REF"
          chmod 700 scripts/deploy-portable-docker-host.sh
          scripts/deploy-portable-docker-host.sh deploy --env-file "$DEPLOY_ENV_FILE"
          scripts/deploy-portable-docker-host.sh smoke --env-file "$DEPLOY_ENV_FILE"
          REMOTE
