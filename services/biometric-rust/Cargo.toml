[package]
name = "inec-biometric-vault"
version = "1.0.0"
edition = "2021"
description = "Production biometric crypto vault, template encryption, and high-speed matching for INEC"

[dependencies]
# Crypto
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
rand = "0.8"
zeroize = { version = "1.7", features = ["derive"] }
# NOTE: argon2, x25519-dalek and bincode were removed — they were declared
# but never used in this crate (bincode 1.x is unmaintained, RUSTSEC-2025-0141).

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hex = "0.4"

# Web
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Database (required — all state persists to PostgreSQL)
# sqlx 0.8: RUSTSEC-2024-0363 (0.7.x binary-protocol truncation/overflow
# casts). 0.8 also pulls rustls 0.23 / rustls-webpki 0.102, clearing the
# webpki 0.101 advisories (RUSTSEC-2026-0098/-0099/-0104).
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono"] }

# Metrics / logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# NOTE: prometheus was removed — declared but never used; it pinned
# protobuf 2.28 (RUSTSEC-2024-0437, no 2.x fix). Re-add prometheus 0.14+
# (protobuf 3.x) if metrics are ever wired.

# Misc
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
rayon = "1.8"

[features]
default = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
