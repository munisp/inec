[package]
name = "inec-hot-path"
version = "0.1.0"
edition = "2021"
description = "Ultra-low-latency hot path for INEC election transaction processing"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Kafka - zero-copy consumer/producer (requires librdkafka-dev at build time)
rdkafka = { version = "0.36", features = ["cmake-build"], optional = true }

# Redis - async pipelining
redis = { version = "0.27", features = ["tokio-comp", "cluster-async"] }

# HTTP client for TigerBeetle/OpenSearch
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Serialization - zero-copy
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"  # MessagePack (smaller, faster than JSON)

# Concurrency
crossbeam = "0.8"

# Hashing
sha2 = "0.10"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# System info
num_cpus = "1"

# Web framework for health/metrics
axum = "0.7"

[features]
default = []
kafka = ["rdkafka"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
