global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "inec-backend"
    metrics_path: "/metrics"
    # The backend FAILS CLOSED on /metrics in production: without a bearer
    # token every scrape is 401 and Prometheus shows the target down
    # (metricsBearerGuard, inec-go-backend/metrics.go). The token file is
    # mounted from observability/prometheus/secrets/metrics_token and must
    # contain the same value as METRICS_BEARER_TOKEN given to go-backend
    # (see observability/docker-compose.monitoring.yml).
    bearer_token_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ["go-backend:8088"]  # compose service name is go-backend
    # In Kubernetes, use service discovery:
    # kubernetes_sd_configs:
    #   - role: pod
    #     namespaces:
    #       names: ["inec"]
    # relabel_configs:
    #   - source_labels: [__meta_kubernetes_pod_label_app]
    #     regex: inec-backend
    #     action: keep

  # R5-094: gotv-svc exposes an unauthenticated promhttp /metrics on :8103
  # (cmd/gotv-svc/main.go) — previously unscraped in compose monitoring.
  - job_name: "gotv-svc"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["gotv-svc:8103"]  # compose service name

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
