groups:
  - name: inec-critical
    rules:
      # --- Availability ---
      - alert: INECBackendDown
        expr: up{job="inec-backend"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "INEC Backend is DOWN"
          description: "The INEC backend has been unreachable for >1 minute. Election operations are halted."
          runbook: "https://github.com/munisp/inec/blob/main/observability/runbooks/backend-down.md"

      # R5-094: gotv-svc serves all /gotv/* campaign traffic — its loss is
      # silent without a scrape target, hence the new gotv-svc job.
      - alert: GOTVServiceDown
        expr: up{job="gotv-svc"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "GOTV service is DOWN"
          description: "gotv-svc (/gotv/* campaign and field-operations API) has been unreachable for >2 minutes."
          runbook: "https://github.com/munisp/inec/blob/main/observability/runbooks/backend-down.md"

      - alert: INECHighErrorRate
        expr: |
          sum(rate(inec_http_requests_total{status=~"5.."}[5m]))
          / sum(rate(inec_http_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "INEC error rate >5%"
          description: "5xx error rate is {{ $value | humanizePercentage }} over the last 5 minutes."
          runbook: "https://github.com/munisp/inec/blob/main/observability/runbooks/high-error-rate.md"

      - alert: INECHighLatency
        expr: |
          histogram_quantile(0.99, sum(rate(inec_http_request_duration_seconds_bucket[5m])) by (le)) > 2
        for: 3m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "INEC p99 latency >2s"
          description: "99th percentile request latency is {{ $value }}s. Users are experiencing slow responses."

      # --- Database ---
      - alert: INECDatabaseDown
        expr: inec_db_connections_active == 0
        for: 30s
        labels:
          severity: critical
          team: dba
        annotations:
          summary: "Database connections dropped to zero"
          description: "No active DB connections. All queries will fail."
          runbook: "https://github.com/munisp/inec/blob/main/observability/runbooks/database-down.md"

      - alert: INECDatabaseConnectionsHigh
        expr: inec_db_connections_active > 45
        for: 5m
        labels:
          severity: warning
          team: dba
        annotations:
          summary: "DB connections at {{ $value }}/50 (90%)"
          description: "Database connection pool is nearly exhausted. New requests may start failing."

      - alert: INECDatabaseSlowQueries
        expr: |
          histogram_quantile(0.95, sum(rate(inec_db_query_duration_seconds_bucket[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: warning
          team: dba
        annotations:
          summary: "DB query p95 >1s"
          description: "Database queries are slow. Check for missing indexes or lock contention."

      # --- Circuit Breakers ---
      # REMOVED (R5-088): INECCircuitBreakerOpen queried
      # inec_arch_circuit_breaker_state, a metric nothing in the repo emits —
      # the alert could never fire. Re-add once the architecture layer emits
      # breaker state (tracked in ops/HANDOFF-W6.md). Until then, breaker
      # trips surface as elevated 5xx on dependent routes (INECHighErrorRate).
      - alert: INECMiddlewareDisconnected
        expr: inec_middleware_healthy == 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Middleware {{ $labels.component }} disconnected"
          description: "Component {{ $labels.component }} has reported unhealthy for >5 minutes."

      # --- Rate Limiting ---
      - alert: INECHighRateLimitRejections
        expr: |
          sum(rate(inec_http_requests_total{status="429"}[5m])) > 10
        for: 5m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "High rate limit rejections ({{ $value }}/s)"
          description: "Potential brute-force attack or misconfigured client."

      # --- Election-Specific ---
      - alert: INECNoResultsSubmitted
        expr: |
          sum(rate(inec_results_submitted_total[15m])) == 0
          and on() (hour() >= 8 and hour() <= 20)
        for: 15m
        labels:
          severity: critical
          team: election-ops
        annotations:
          summary: "No election results submitted in 15 minutes"
          description: "During election hours (08:00-20:00), no results have been submitted. Possible system outage or connectivity issue."

      # REMOVED (R5-088): INECBiometricFailureRateHigh and
      # INECGeofenceViolationSpike queried inec_arch_biometric_verifications_total
      # and inec_arch_events_published_total — metrics nothing in the repo
      # emits, so these alerts could never fire. They are restored in
      # ops/HANDOFF-W6.md pending emission of the underlying series by the
      # owning Go modules (architecture/biometric layers). A coarse proxy is
      # the 403-rate on /results/submit (geofence violations are rejected
      # with 403 by handleSubmitResult):
      - alert: INECGeofenceRejectionSpike
        expr: |
          # path label is sanitizePath()-normalized: /results/submit -> /results/:id
          sum(rate(inec_http_requests_total{path="/results/:id", status="403"}[5m])) * 60 > 5
        for: 5m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "Geofence/authorization rejection spike on result submit ({{ $value }}/min)"
          description: "Multiple result submissions rejected with 403 — possible geofence violations or mis-scoped officer accounts."

  - name: inec-slo
    rules:
      # --- SLO: Availability (target: 99.95%) ---
      - record: inec:slo:availability:ratio_5m
        expr: |
          1 - (
            sum(rate(inec_http_requests_total{status=~"5.."}[5m]))
            / sum(rate(inec_http_requests_total[5m]))
          )

      - alert: INECSLOAvailabilityBreach
        expr: inec:slo:availability:ratio_5m < 0.9995
        for: 10m
        labels:
          severity: warning
          team: platform
          slo: availability
        annotations:
          summary: "SLO breach: availability {{ $value | humanizePercentage }} (target: 99.95%)"

      # --- SLO: Latency (target: p99 < 500ms) ---
      - record: inec:slo:latency:p99_5m
        expr: |
          histogram_quantile(0.99, sum(rate(inec_http_request_duration_seconds_bucket[5m])) by (le))

      - alert: INECSLOLatencyBreach
        expr: inec:slo:latency:p99_5m > 0.5
        for: 10m
        labels:
          severity: warning
          team: platform
          slo: latency
        annotations:
          summary: "SLO breach: p99 latency {{ $value }}s (target: <500ms)"
