server {
    # nginxinc/nginx-unprivileged (uid 101) — cannot bind :80.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Security headers (applied to every response, incl. errors) ─────────
    # CSP: the SPA loads its own bundles/styles, map tiles and glyphs over
    # HTTPS, and calls the API via same-origin proxy paths (and HTTPS API
    # origins in deployments where VITE_API_URL is absolute). 'unsafe-inline'
    # for style-src is required by React inline style attributes; script-src
    # stays locked to self. Tighten connect-src/img-src to explicit hosts when
    # the production tile/API origins are finalized.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), interest-cohort=()" always;

    # Health check for k8s liveness/readiness probes
    location = /health {
        access_log off;
        return 200 '{"status":"healthy","service":"inec-frontend"}';
        add_header Content-Type application/json;
    }

    location = /readiness {
        proxy_pass http://inec-backend:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GOTV/campaign API — /gotv/* is served by gotv-svc (port 8103), NOT the
    # monolith backend (its gotv tree was removed, R5-097). Same-origin
    # frontend calls would otherwise 404.
    location /gotv/ {
        proxy_pass http://gotv-svc:8103;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location ~ ^/(\.well-known|admin|ai|ai-monitoring|api|audit|auth|biometric|blockchain|bvas|command-center|dashboard|db|disputes|document-ai|elections|ems|export|geo|geofence|healthz|incidents|inec|ingestion|kyc|middleware|observer|parties|pgpool|production|push|results|scale|sms|stakeholders|training|ussd|voters|uploads)(/|$) {
        proxy_pass http://inec-backend:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_pass_header X-Accel-Buffering;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
