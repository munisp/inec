entity user {}

entity organization {
    relation admin @user
    relation member @user
    action view = admin
    action edit = admin
}

entity state {
    relation org @organization
    relation admin @user
    relation collation_officer @user
    action view = admin or collation_officer or org.admin
    action collate = collation_officer
}

entity lga {
    relation state @state
    relation admin @user
    relation collation_officer @user
    action view = admin or collation_officer or state.view
    action collate = collation_officer
}

entity ward {
    relation lga @lga
    relation admin @user
    relation collation_officer @user
    action view = admin or collation_officer or lga.view
    action collate = collation_officer
}

entity polling_unit {
    relation ward @ward
    relation presiding_officer @user
    relation observer @user
    action view = presiding_officer or observer or ward.view
    action submit_results = presiding_officer
    action report_incident = observer or presiding_officer
}

entity election {
    relation org @organization
    relation admin @user
    relation observer @user
    relation presiding_officer @user
    relation collation_officer @user
    relation returning_officer @user
    action view = admin or observer or presiding_officer or collation_officer or returning_officer or org.admin
    action edit = admin or org.admin
    action delete = admin or org.admin
    action submit_results = presiding_officer
    action collate_results = collation_officer
    action finalize_results = returning_officer
}

entity result {
    relation election @election
    relation polling_unit @polling_unit
    relation submitter @user
    action view = election.view
    action edit = submitter or election.admin
}

entity incident {
    relation election @election
    relation polling_unit @polling_unit
    relation reporter @user
    action view = election.view
    action edit = reporter or election.admin
    action resolve = election.admin
}

# Device relations are used by the dedicated mTLS gateway. Device trust is not
# granted by a browser session; these actions govern administrative enrollment.
entity bvas_device {
    relation election @election
    relation admin @user
    relation ict_officer @user
    relation security @user
    action manage_bvas = admin or ict_officer or election.admin
    action view = admin or ict_officer or security or election.view
    action request_operational_settlement = admin or ict_officer
}

# Operational settlements are limited to approved BVAS logistics, reimbursement,
# and repair commitments. They intentionally have no relation to results, voters,
# PVCs, biometrics, ballots, or public-result publication.
entity operational_settlement {
    relation election @election
    relation device @bvas_device
    relation requester @user
    relation approver @user
    relation admin @user
    relation finance_officer @user
    relation ict_officer @user
    action request_operational_settlement = admin or finance_officer or device.request_operational_settlement
    action approve_operational_settlement = admin or finance_officer
    action commit_operational_settlement = admin or finance_officer
    action dispatch_operational_settlement = admin or finance_officer
    action reconcile_operational_settlement = admin or finance_officer
    action void_operational_settlement = admin or finance_officer
    action view_operational_settlement = requester or approver or admin or finance_officer or ict_officer or election.view
}
