# APISIX standalone route table (edge concerns only: CORS, rate limiting,
# caching, mTLS device gateway).
#
# 2026-08-12 hardening: the jwt-auth plugin was REMOVED from these routes.
# APISIX had jwt-auth attached but zero consumers configured, which fails
# closed with 401 for everything (or tempts operators to disable auth at the
# gateway entirely). JWT authentication/authorization is enforced by the
# go-backend middleware (see config/apisix/routes.json); APISIX handles edge
# concerns only.
#
# R5-082 (rate-limit keying): traffic arrives via Caddy, so the TCP peer of
# every request is CADDY, and a limit-req keyed on a raw remote_addr becomes
# ONE GLOBAL BUCKET for the whole country (the previous /results/* budget of
# 20 req/s + burst 10 was national, not per-client). The global real-ip rule
# below restores the client address from X-Forwarded-For — but ONLY when the
# immediate peer is in trusted_addresses (the Docker bridge ranges Caddy runs
# on), so direct clients cannot spoof XFF to evade the limiter. After this
# rule, remote_addr in limit-req IS the forwarded client identity.
#
# Trusted-peer note: inec-network is a private bridge carrying only platform
# containers; Caddy is the only ingress. Tighten trusted_addresses to the
# exact Caddy container IP/subnet in production deployments.
global_rules:
  - plugins:
      real-ip:
        source: http_x_forwarded_for
        trusted_addresses:
          - "172.16.0.0/12"   # docker default bridge pool (inec-network)
          - "10.0.0.0/8"      # private overlay/swarm ranges
          - "192.168.0.0/16"
#
# PER-ENDPOINT BUDGETS (per restored client IP, per second) — election-day
# sizing (see loadtest/k6_election_day.js header):
#   ~176,846 polling units; 80% reporting within a 4h window ≈ 10 rps
#   national average, ~200 rps national peak (20x peak-to-average).
#   Carrier NAT concentrates officers: assume a busy LGA with ~2,000 PUs
#   behind ONE egress IP reporting within 2h ≈ 0.3 rps average, <10 rps
#   peak per IP. Budgets below are >=2.5x that per-IP peak and are now
#   PER CLIENT IP, so the national envelope is sum-over-IPs, not a single
#   global bucket.
routes:
- plugins:
    cors: {}
    limit-req:
      burst: 5
      key: remote_addr
      key_type: var
      rate: 10
  upstream:
    nodes:
      go-backend:8088: 1
    type: roundrobin
  uri: /auth/*
- plugins:
    cors: {}
    limit-req:
      burst: 10
      key: remote_addr
      key_type: var
      rate: 30
  upstream:
    nodes:
      go-backend:8088: 1
    type: roundrobin
  uri: /elections/*
# Result write/read path (EC8A submissions). Budget per client IP — a busy
# LGA behind one carrier-NAT egress peaks at <10 req/s (see header); the
# previous global 20 req/s would have 429'd legitimate submissions
# nationwide at peak. Backend additionally enforces its own per-identity
# limits (see ops/HANDOFF-W6.md, R5-091).
- plugins:
    cors: {}
    limit-req:
      burst: 50
      key: remote_addr
      key_type: var
      rate: 25
  upstream:
    nodes:
      go-backend:8088: 1
    type: roundrobin
  uri: /results/*
# Offline/batch ingestion from field devices (BVAS backlog sync). Previously
# had NO edge route at all (traffic fell through to 404) and no budget.
# Batch uploads are bursty but device-scoped; 20 req/s per client IP.
- plugins:
    cors: {}
    limit-req:
      burst: 40
      key: remote_addr
      key_type: var
      rate: 20
  upstream:
    nodes:
      go-backend:8088: 1
    type: roundrobin
  uri: /ingestion/*
# GOTV/campaign API served by gotv-svc (R5-089: previously unrouted — the
# frontend's same-origin /gotv/* calls fell through to the SPA).
- plugins:
    cors: {}
    limit-req:
      burst: 60
      key: remote_addr
      key_type: var
      rate: 30
  upstream:
    nodes:
      gotv-svc:8103: 1
    type: roundrobin
  uri: /gotv/*
- plugins:
    cors: {}
    limit-req:
      burst: 60
      key: remote_addr
      key_type: var
      rate: 120
    proxy-cache:
      cache_ttl: 300
  upstream:
    nodes:
      go-backend:8088: 1
    type: roundrobin
  uri: /geo/tiles/*
- plugins:
    cors: {}
    limit-req:
      burst: 30
      key: remote_addr
      key_type: var
      rate: 60
  upstream:
    nodes:
      go-backend:8088: 1
    type: roundrobin
  uri: /geo/*
- plugins:
    cors: {}
    limit-req:
      burst: 15
      key: remote_addr
      key_type: var
      rate: 30
  upstream:
    nodes:
      go-backend:8088: 1
    type: roundrobin
  uri: /dashboard/*
- plugins:
    cors: {}
    limit-req:
      burst: 10
      key: remote_addr
      key_type: var
      rate: 20
  upstream:
    nodes:
      go-backend:8088: 1
    type: roundrobin
  uri: /audit/*
- plugins:
    cors: {}
    limit-req:
      burst: 5
      key: remote_addr
      key_type: var
      rate: 15
  upstream:
    nodes:
      go-backend:8088: 1
    type: roundrobin
  uri: /incidents/*
- plugins:
    cors: {}
  upstream:
    nodes:
      go-backend:8088: 1
    type: roundrobin
  uri: /middleware/*
- plugins:
    cors: {}
  upstream:
    nodes:
      go-backend:8088: 1
    type: roundrobin
  uri: /parties
- plugins:
    cors: {}
  upstream:
    nodes:
      go-backend:8088: 1
    type: roundrobin
  uri: /healthz
- plugins:
    cors: {}
    response-rewrite:
      headers:
        set:
          Cache-Control: no-cache, no-store, must-revalidate
          Expires: '0'
          Pragma: no-cache
  upstream:
    nodes:
      frontend:80: 1
    type: roundrobin
  uri: /
- plugins:
    cors: {}
    response-rewrite:
      headers:
        set:
          Cache-Control: no-cache, no-store, must-revalidate
          Expires: '0'
          Pragma: no-cache
  upstream:
    nodes:
      frontend:80: 1
    type: roundrobin
  uri: /index.html
- plugins:
    cors: {}
    response-rewrite:
      headers:
        set:
          Cache-Control: no-cache, no-store, must-revalidate
          Service-Worker-Allowed: /
  upstream:
    nodes:
      frontend:80: 1
    type: roundrobin
  uri: /sw.js
- plugins:
    cors: {}
    response-rewrite:
      headers:
        set:
          Cache-Control: public, max-age=31536000, immutable
  upstream:
    nodes:
      frontend:80: 1
    type: roundrobin
  uri: /assets/*
- plugins:
    cors: {}
    response-rewrite:
      headers:
        set:
          Cache-Control: public, max-age=3600
  upstream:
    nodes:
      frontend:80: 1
    type: roundrobin
  uri: /manifest.json
- plugins:
    cors: {}
    limit-req:
      burst: 5
      key: remote_addr
      key_type: var
      rate: 10
  upstream:
    nodes:
      go-backend:8088: 1
    type: roundrobin
  uri: /biometric/*
- plugins:
    cors: {}
    limit-req:
      burst: 10
      key: remote_addr
      key_type: var
      rate: 20
  upstream:
    nodes:
      go-backend:8088: 1
    type: roundrobin
  uri: /workflows/*
- plugins:
    cors: {}
    limit-req:
      burst: 2
      key: remote_addr
      key_type: var
      rate: 5
  upstream:
    nodes:
      go-backend:8088: 1
    type: roundrobin
  uri: /lakehouse/*
- plugins:
    cors: {}
    limit-req:
      burst: 50
      key: remote_addr
      key_type: var
      rate: 100
  upstream:
    nodes:
      go-backend:8088: 1
    type: roundrobin
  uri: /fluvio/*

# BVAS-style device events are accepted only through the dedicated client-certificate SNI.
# The matching SSL resource is provisioned from protected certificate material by
# config/apisix/provision-device-gateway-mtls.sh; APISIX rejects the TLS handshake
# before this route when the client certificate is absent or invalid.
- methods:
  - POST
  plugins:
    client-control:
      max_body_size: 131072
    limit-req:
      burst: 4
      key: ssl_client_fingerprint
      key_type: var
      rate: 8
    proxy-rewrite:
      headers:
        remove:
        - X-Device-Gateway
        - X-Device-Certificate-Fingerprint
        - X-SSL-Client-Fingerprint
        - X-SSL-Client-Verify
        - X-SSL-Client-Serial
        - X-SSL-Client-S-DN
        set:
          X-Device-Gateway: apisix-mtls
          X-Device-Certificate-Fingerprint: $ssl_client_fingerprint
          X-SSL-Client-Fingerprint: $ssl_client_fingerprint
          X-SSL-Client-Verify: $ssl_client_verify
          X-SSL-Client-Serial: $ssl_client_serial
          X-SSL-Client-S-DN: $ssl_client_s_dn
    request-id: {}
  upstream:
    nodes:
      go-backend:8088: 1
    type: roundrobin
  uri: /device-gateway/v1/events

#END
